apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chat-ingress
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - chatspace.local
      secretName: chatspace-tls
  rules:
    - host: chatspace.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chat-app
                port:
                  number: 80
