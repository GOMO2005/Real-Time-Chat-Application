apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  labels:
    app: flask-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-app
          image: chatspacereal-timemessagingapp-flask-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000

          env:
            - name: PYTHONDONTWRITEBYTECODE
              valueFrom:
                configMapKeyRef:
                  name: flask-config
                  key: PYTHONDONTWRITEBYTECODE

            - name: PYTHONUNBUFFERED
              valueFrom:
                configMapKeyRef:
                  name: flask-config
                  key: PYTHONUNBUFFERED

          volumeMounts:
            - name: uploads-volume
              mountPath: /app/uploads

      volumes:
        - name: uploads-volume
          persistentVolumeClaim:
            claimName: uploads-pvc