<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
<style>
    .chat-box { max-height: 400px; overflow-y: auto; margin-bottom: 15px; }
    .message-box { max-height: 200px; resize: none; }
    .file-upload-wrapper { display: flex; align-items: center; margin-top: 10px; }
    .message { padding: 5px; margin-bottom: 5px; border-radius: 5px; }
    .message .meta { font-size: 0.8em; color: #555; }
    .message .reactions { font-size: 0.8em; cursor: pointer; margin-left: 5px; }
    .typing-indicator { font-style: italic; color: #888; }
    .avatar { width: 30px; height: 30px; border-radius: 50%; margin-right: 5px; }
</style>
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="row">
        <!-- Online Users -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Online Users</h5>
                    <ul id="users-list" class="list-group">
                        {% for user in users_online %}
                        <li class="list-group-item">{{ user }}</li>
                        {% endfor %}
                    </ul>
                </div>
            </div>
        </div>
        <!-- Chat -->
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Chat</h5>
                    <div id="messages" class="chat-box"></div>
                    <div id="typing-indicator" class="typing-indicator"></div>
                    <div class="form-group">
                        <textarea id="message" class="form-control message-box" rows="3" placeholder="Type a message"></textarea>
                    </div>
                    <button class="btn btn-primary btn-block" onclick="sendMessage()">Send Message</button>
                    <div class="file-upload-wrapper">
                        <input type="file" id="file-input" class="form-control-file">
                        <button class="btn btn-success ml-2" onclick="sendFile()">Send File</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="text-center mt-3">
        <a href="{{ url_for('logout') }}" class="btn btn-danger">Logout</a>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.1/socket.io.min.js"></script>
<script>
const socket = io(location.protocol + '//' + document.domain + ':' + location.port + '/chat');
const messagesBox = document.getElementById('messages');
const usersList = document.getElementById('users-list');
const typingIndicator = document.getElementById('typing-indicator');
let typingTimeout;

// Scroll to bottom
function scrollToBottom() { messagesBox.scrollTop = messagesBox.scrollHeight; }

// ------------------ MESSAGE HANDLERS ------------------
socket.on('message', data => {
    const div = document.createElement('div');
    div.className = 'message alert alert-secondary';
    div.innerHTML = `
        <span class="meta">${data.timestamp} <strong>${data.username}</strong>:</span>
        <div>${data.msg}</div>
        <span class="reactions">❤️</span>
    `;
    messagesBox.appendChild(div);
    scrollToBottom();
});

socket.on('file_message', data => {
    const div = document.createElement('div');
    div.className = 'message alert alert-info';
    div.innerHTML = `
        <span class="meta">${data.timestamp} <strong>${data.username}</strong>:</span>
        <div>📎 <a href="/uploads/${encodeURIComponent(data.filename)}" target="_blank">${data.filename}</a></div>
    `;
    messagesBox.appendChild(div);
    scrollToBottom();
});

// ------------------ USER HANDLERS ------------------
socket.on('user_connected', data => {
    updateOnlineUsers(data.username);
});
socket.on('user_disconnected', data => {
    removeOnlineUser(data.username);
});

function updateOnlineUsers(username){
    for (let item of usersList.children) { if(item.textContent === username) return; }
    const li = document.createElement('li'); li.className = 'list-group-item'; li.textContent = username;
    usersList.appendChild(li);
}
function removeOnlineUser(username){
    for (let item of usersList.children) { if(item.textContent === username) { usersList.removeChild(item); break; } }
}

// ------------------ TYPING ------------------
document.getElementById('message').addEventListener('input', () => {
    socket.emit('typing', { typing: true });
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => { socket.emit('typing', { typing: false }); }, 1000);
});

socket.on('typing', data => {
    typingIndicator.textContent = data.typing ? `${data.username} is typing...` : '';
});

// ------------------ SEND MESSAGES ------------------
function sendMessage(){
    const input = document.getElementById('message');
    const msg = input.value.trim();
    if(!msg) return;
    socket.emit('message', msg);
    input.value = '';
}

function sendFile(){
    const input = document.getElementById('file-input');
    const file = input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
        socket.emit('file_message', { filename: file.name, file_data: reader.result });
        input.value = '';
    };
    reader.readAsDataURL(file);
}

// ------------------ REACTIONS ------------------
messagesBox.addEventListener('click', e => {
    if(e.target.classList.contains('reactions')){
        const msgDiv = e.target.closest('.message');
        const msgId = msgDiv.dataset.msgId;
        socket.emit('react_message', { msg_id: msgId, emoji: '❤️' });
    }
});

// ------------------ MENTIONS / NOTIFICATIONS ------------------
socket.on('mention', data => {
    if(Notification.permission === "granted"){
        new Notification(`${data.from} mentioned you`, { body: data.msg });
    } else if(Notification.permission !== "denied"){
        Notification.requestPermission();
    }
});
</script>
</body>
</html>
